name: Build iResidencia APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'docs/index.html'
      - 'docs/icon.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Offline-First Android WebView project
        run: |
          mkdir -p android_app/app/src/main/java/com/iresidencia/gemini
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android_app/app/src/main/assets/docs
          cp -r docs/* android_app/app/src/main/assets/docs/
          cp docs/icon.png android_app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp docs/icon.png android_app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          cat << 'EOF' > android_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iResidenciaGemini"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          VER_CODE=$((GITHUB_RUN_NUMBER + 10))
          cat << EOF > android_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.iresidencia.gemini'
              compileSdk 34
              defaultConfig {
                  applicationId "com.iresidencia.gemini"
                  minSdk 24
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "1.2.1"
              }
              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:statusBarColor">#121212</item>
                  <item name="android:navigationBarColor">#202020</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="iResidencia"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/iresidencia/gemini/MainActivity.java
          package com.iresidencia.gemini;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private ConnectivityManager connectivityManager;
              private ConnectivityManager.NetworkCallback networkCallback;
              private volatile boolean lastOnlineState = false;

              private static final String APP_HOST = "drcarlosperseverance-beep.github.io";
              private static final String APP_PREFIX = "/iResidencia-Gemini/";
              private static final String APP_URL = "https://" + APP_HOST + APP_PREFIX;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#121212"));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setUserAgentString(s.getUserAgentString() + " iResidenciaAPK/1.1.0");

                  lastOnlineState = isNetworkAvailable();
                  webView.setNetworkAvailable(lastOnlineState);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (!"GET".equalsIgnoreCase(request.getMethod())) {
                              return null;
                          }
                          Uri uri = request.getUrl();
                          if (uri == null || !APP_HOST.equalsIgnoreCase(uri.getHost())) {
                              return null;
                          }
                          String path = uri.getPath();
                          if (path == null || !path.startsWith(APP_PREFIX)) {
                              return null;
                          }
                          String rel = path.substring(APP_PREFIX.length());
                          if (rel.isEmpty() || rel.endsWith("/")) {
                              rel = rel + "index.html";
                          }
                          if (rel.contains("..")) {
                              return null;
                          }

                          String mime = guessMime(rel);

                          // Static question banks: serve directly from bundled APK assets for instant 100% offline use
                          if (rel.matches("data/(cat_\\d+|exams)\\.json")) {
                              WebResourceResponse assetResp = serveFromAssets(rel, mime);
                              if (assetResp != null) {
                                  return assetResp;
                              }
                          }

                          // Dynamic files (index.html, meta.json, gemini_sync.json, user_sync.json):
                          // Try network when online and cache locally; fall back to local cache -> bundled assets when offline.
                          if (isNetworkAvailable()) {
                              byte[] fresh = fetchUrlBytes(uri.toString());
                              if (fresh != null) {
                                  saveToCache(rel, fresh);
                                  return buildResponse(mime, fresh);
                              }
                          }

                          WebResourceResponse cached = serveFromCache(rel, mime);
                          if (cached != null) {
                              return cached;
                          }
                          return serveFromAssets(rel, mime);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  registerNetworkMonitor();
                  webView.loadUrl(APP_URL);
              }

              private void registerNetworkMonitor() {
                  try {
                      connectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (connectivityManager == null) return;
                      networkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              notifyNetworkState(true);
                          }

                          @Override
                          public void onLost(Network network) {
                              notifyNetworkState(isNetworkAvailable());
                          }
                      };
                      connectivityManager.registerDefaultNetworkCallback(networkCallback);
                  } catch (Exception ignored) {}
              }

              private void notifyNetworkState(final boolean online) {
                  if (online == lastOnlineState) return;
                  lastOnlineState = online;
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.setNetworkAvailable(online);
                          webView.evaluateJavascript(
                              "if(window.onAndroidNetworkChange){window.onAndroidNetworkChange(" + online + ");}",
                              null
                          );
                      }
                  });
              }

              private boolean isNetworkAvailable() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;
                      Network active = cm.getActiveNetwork();
                      if (active == null) return false;
                      NetworkCapabilities caps = cm.getNetworkCapabilities(active);
                      return caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private byte[] fetchUrlBytes(String urlStr) {
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(urlStr).openConnection();
                      conn.setConnectTimeout(4000);
                      conn.setReadTimeout(6000);
                      conn.setUseCaches(false);
                      conn.setRequestProperty("Cache-Control", "no-cache");
                      if (conn.getResponseCode() != 200) return null;
                      try (InputStream in = conn.getInputStream();
                           ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                          return out.toByteArray();
                      }
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private void saveToCache(String rel, byte[] data) {
                  try {
                      File outFile = new File(new File(getFilesDir(), "webcache"), rel);
                      File parent = outFile.getParentFile();
                      if (parent != null && !parent.exists()) parent.mkdirs();
                      try (FileOutputStream fos = new FileOutputStream(outFile)) {
                          fos.write(data);
                      }
                  } catch (Exception ignored) {}
              }

              private WebResourceResponse serveFromCache(String rel, String mime) {
                  try {
                      File f = new File(new File(getFilesDir(), "webcache"), rel);
                      if (!f.exists() || !f.isFile()) return null;
                      return buildResponse(mime, new FileInputStream(f));
                  } catch (Exception e) {
                      return null;
                  }
              }

              private WebResourceResponse serveFromAssets(String rel, String mime) {
                  try {
                      InputStream is = getAssets().open("docs/" + rel);
                      return buildResponse(mime, is);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private WebResourceResponse buildResponse(String mime, byte[] data) {
                  return buildResponse(mime, new ByteArrayInputStream(data));
              }

              private WebResourceResponse buildResponse(String mime, InputStream is) {
                  Map<String, String> headers = new HashMap<>();
                  headers.put("Cache-Control", "no-store");
                  return new WebResourceResponse(mime, "UTF-8", 200, "OK", headers, is);
              }

              private String guessMime(String rel) {
                  if (rel.endsWith(".html")) return "text/html";
                  if (rel.endsWith(".json")) return "application/json";
                  if (rel.endsWith(".js")) return "application/javascript";
                  if (rel.endsWith(".css")) return "text/css";
                  return "application/octet-stream";
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (connectivityManager != null && networkCallback != null) {
                      try {
                          connectivityManager.unregisterNetworkCallback(networkCallback);
                      } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }
          }
          EOF
      - name: Build Signed Release APK
        working-directory: android_app
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/release.jks
          gradle assembleRelease --no-daemon
          rm -f app/release.jks
      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android_app/app/build/outputs/apk/release/app-release.apk iResidencia-Gemini-v1.2.1.apk
          if gh release view v1.2.1 >/dev/null 2>&1; then
            gh release upload v1.2.1 iResidencia-Gemini-v1.2.1.apk --clobber
            exit 0
          fi
          gh release create v1.2.1 iResidencia-Gemini-v1.2.1.apk \
            --title "iResidencia Gemini v1.2.1 (Firma fija para actualizaciones)" \
            --notes "APK firmada con certificado fijo (release) y versionCode autoincremental: de aquí en adelante podrás instalar futuras versiones encima sin desinstalar ni perder datos. Incluye ícono de oso estudioso, revisión fluida con swipe/filtros y modo 100% offline."
