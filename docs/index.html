<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>iResidencia · Gemini</title>
<style>
:root{color-scheme:dark;--bg:#121212;--panel:#202020;--panel2:#292929;--purple:#9584b6;--teal:#51b9b0;--muted:#acacb3;--text:#ecebed;--red:#e68c99;--amber:#e8c47c;--ui-scale:1;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:calc(16px * var(--ui-scale,1))}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit;color:var(--text)}
button{cursor:pointer;border:0;border-radius:.9rem;background:#303033;padding:.65rem .95rem}
button:hover:not(:disabled){filter:brightness(1.14)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--purple);color:#fff;font-weight:700}
button.teal{background:#244442;color:#8bdbd3;font-weight:650}
button.danger{background:#492e35;color:#ffaabb}
button.ghost{background:transparent;border:1px solid #444}
input,select,textarea{background:#151515;border:1px solid #45454a;border-radius:.75rem;padding:.6rem .75rem;max-width:100%}
h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:#202020f5;border-bottom:1px solid #292929;padding:.75rem max(1rem,calc((100vw - 1020px)/2));display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.brand{font-size:1.4rem;font-weight:800;color:var(--purple);cursor:pointer}.brand span{color:var(--teal)}.brand small{font-size:.9rem;color:var(--text);font-weight:600}
.top-actions{display:flex;align-items:center;gap:.35rem}
.zoom-controls{display:flex;align-items:center;gap:3px}.zoom-controls button{padding:0;width:32px;height:32px;background:#36303f;border-radius:9px;font-size:13px;font-weight:700}
.zoom-value{font-size:11px;min-width:32px;text-align:center;color:#cbbde3}
.iconbtn{background:transparent;color:var(--purple);font-size:1.25rem;padding:4px 7px}
.statusbar{max-width:1020px;margin:auto;padding:.55rem 1rem;font-size:.75rem;display:flex;justify-content:space-between;gap:.5rem;color:var(--muted)}
.badge-ok{color:var(--teal);font-weight:600}.badge-off{color:var(--amber);font-weight:600}
main{max-width:1020px;margin:auto;padding:.6rem 1rem 6rem}
.hero{background:linear-gradient(135deg,#8773ad,#6c5a8f);border-radius:1.35rem;padding:1.3rem 1.4rem;margin-bottom:1.1rem;color:#fff}
.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:.68rem;font-weight:700;opacity:.88;margin-bottom:.3rem}
.hero h1{font-size:1.45rem;margin-bottom:.3rem}.hero p{margin:0;line-height:1.45;font-size:.9rem;color:#f3eefc}
.card{background:var(--panel);border-radius:1.25rem;padding:1.15rem;margin-bottom:.95rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.cat-card{cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .14s}.cat-card:hover{transform:translateY(-2px)}
.cat-banner{height:3.8rem;border-radius:.85rem;display:flex;align-items:center;justify-content:space-between;padding:0 .9rem;margin-bottom:.8rem;color:#1b1b1e;font-weight:800;font-size:1.35rem}
.c1{background:#e9c9c9}.c2{background:#c9e1cb}.c3{background:#f0ddb8}.c4{background:#c2dcec}.c5{background:#dbc6e2}.c6{background:#eec7d6}
.cat-foot{display:flex;justify-content:flex-end;color:var(--teal);font-size:.84rem;font-weight:650}
.row{display:flex;align-items:center;justify-content:space-between;gap:.65rem;flex-wrap:wrap}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#202020fa;border-top:1px solid #333;display:flex;justify-content:center;gap:clamp(4px,3vw,2.2rem);padding:.5rem .35rem calc(.5rem + env(safe-area-inset-bottom))}
.bottom button{background:transparent;color:var(--muted);padding:.2rem .55rem;border-radius:1rem;display:flex;flex-direction:column;align-items:center;gap:.18rem;font-size:.7rem;min-width:4.2rem}
.bottom button span{font-size:1.2rem;line-height:1.6rem;min-width:2.8rem;border-radius:1rem}
.bottom button.active{color:#cbb9ec;font-weight:700}.bottom button.active span{background:var(--purple);color:#fff}
.qnav{display:flex;gap:.4rem;overflow:auto;padding:.45rem 0 .7rem}
.qnav button{width:2.1rem;min-width:2.1rem;height:2.1rem;border-radius:50%;padding:0;border:2px solid #555;background:transparent;font-size:.78rem}
.qnav button.selected{box-shadow:0 0 0 3px var(--purple)}.qnav button.answered{border-color:var(--purple);color:#dacbf1}.qnav button.good{border-color:var(--teal);color:var(--teal)}.qnav button.bad{border-color:var(--red);color:var(--red)}
.question-box{background:var(--purple);color:#fff;padding:1.15rem;border-radius:1.2rem;margin-bottom:.9rem;line-height:1.48;font-size:1.05rem;white-space:pre-wrap}
.tag{display:inline-block;background:#ffffff28;border-radius:.45rem;padding:.18rem .5rem;font-size:.7rem;margin-top:.65rem;margin-right:.3rem}
.answers{background:var(--panel);border-radius:1.2rem;overflow:hidden;margin-bottom:.9rem}
.answer{display:flex;align-items:flex-start;gap:.8rem;padding:.95rem 1.05rem;width:100%;border-bottom:1px solid #303030;border-radius:0;background:transparent;text-align:left;line-height:1.38}
.answer:last-child{border:0}.letter{border:2px solid #818187;border-radius:50%;width:1.7rem;min-width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.answer.chosen .letter{background:var(--purple);border-color:var(--purple);color:#fff}
.answer.correct{color:var(--teal);font-weight:700}.answer.correct .letter{background:var(--teal);border-color:var(--teal);color:#fff}
.answer.wrong{color:var(--red)}.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#181818}
.explain{background:#1d3533;border-left:4px solid var(--teal);padding:.85rem .95rem;border-radius:.7rem;margin-bottom:.9rem;font-size:.88rem;line-height:1.48}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.metric{background:var(--panel);border-radius:1rem;padding:.95rem}.metric strong{display:block;font-size:1.45rem;color:var(--teal);margin-top:.15rem}
.config-row{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.7rem .9rem;background:var(--panel2);border-radius:.9rem;margin-bottom:.5rem}
.config-row input[type=number]{width:4.6rem;text-align:center}
.bar{height:.48rem;background:#35353a;border-radius:999px;overflow:hidden;margin:.4rem 0}.bar span{display:block;height:100%;background:var(--teal)}
.bar span.mid{background:var(--amber)}.bar span.low{background:var(--red)}
.cat-stat{padding:.75rem .9rem;background:var(--panel2);border-radius:.9rem;margin-bottom:.55rem}
.cat-stat:last-child{margin-bottom:0}
.pct-hi{color:var(--teal)}.pct-mid{color:var(--amber)}.pct-lo{color:var(--red)}
.btn-sm{padding:.42rem .68rem;font-size:.82rem;border-radius:.7rem}
.summary-bar{background:var(--panel);border:1px solid var(--teal);border-radius:1rem;padding:.6rem .85rem;margin-bottom:.65rem}
.filter-pills{display:flex;gap:.4rem;margin-bottom:.45rem;flex-wrap:wrap}
.filter-pills button{padding:.32rem .68rem;font-size:.78rem;border-radius:999px;background:var(--panel2);color:var(--muted)}
.filter-pills button.active{background:var(--purple);color:#fff;font-weight:700}
.runner-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem}
.runner-nav button{flex:1;padding:.72rem .9rem;font-weight:700}
.qnav{scroll-behavior:auto;-webkit-overflow-scrolling:touch}
main{padding-bottom:6.8rem}
#toast{position:fixed;bottom:5.2rem;left:50%;transform:translateX(-50%);background:#3a3047;color:#fff;padding:.7rem 1.1rem;border-radius:.8rem;box-shadow:0 8px 24px #0008;z-index:100;display:none;max-width:90vw;font-size:.86rem}
@media(max-width:740px){.grid{grid-template-columns:repeat(2,1fr)}.stat-grid{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.brand small{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="setTab('quiz')"><span>i</span>Residencia <small id="sectionName">→ Quiz</small></div>
  <div class="top-actions">
    <div class="zoom-controls">
      <button onclick="changeZoom(-0.08)">A−</button>
      <span class="zoom-value" id="zoomVal">100%</span>
      <button onclick="changeZoom(0.08)">A+</button>
    </div>
    <button class="iconbtn" onclick="syncAll(true)" title="Sincronizar con Gemini">↻</button>
    <button class="iconbtn" onclick="setTab('settings')" title="Ajustes y modo offline">⚙</button>
  </div>
</header>
<div class="statusbar">
  <span id="syncStatus">Cargando datos…</span>
  <span id="offlineBadge"></span>
</div>
<main id="app"><div class="card muted">Cargando iResidencia…</div></main>
<nav class="bottom">
  <button data-tab="quiz" class="active" onclick="setTab('quiz')"><span>☑</span>Quiz</button>
  <button data-tab="exams" onclick="setTab('exams')"><span>▤</span>Simulador</button>
  <button data-tab="gemini" onclick="setTab('gemini')"><span>✦</span>Gemini</button>
  <button data-tab="history" onclick="setTab('history')"><span>◷</span>Historial</button>
  <button data-tab="stats" onclick="setTab('stats')"><span>▥</span>Stats</button>
</nav>
<div id="toast"></div>
<script>
const REPO = 'drcarlosperseverance-beep/iResidencia-Gemini';
const CACHE_NAME = 'iresidencia-offline-v4';
const IS_APK = /iResidenciaAPK/i.test(navigator.userAgent||'');
const CAT_ICONS = {0:'📝',1:'🩺',2:'🧬',3:'🏥',4:'👶',5:'🫀',6:'🤰'};
const DEFAULT_CATS = [
  {id:1,name:'Cirugía General',count:1839},{id:2,name:'Ciencias Básicas',count:5345},
  {id:3,name:'Salud Pública',count:976},{id:4,name:'Pediatría',count:4186},
  {id:5,name:'Medicina Interna',count:2603},{id:6,name:'Ginecología y Obstetricia',count:2634}
];
const state = {
  tab:'quiz', zoom:Number(localStorage.getItem('ires_zoom')||1),
  meta:JSON.parse(localStorage.getItem('ires_meta')||'null')||{categories:DEFAULT_CATS,exams:[]},
  gemini:JSON.parse(localStorage.getItem('ires_gemini')||'null')||{simulacrosGemini:[],planGemini:[],preguntasExtra:[],updatedAt:''},
  savedQuizzes:JSON.parse(localStorage.getItem('ires_saved')||'[]'),
  history:JSON.parse(localStorage.getItem('ires_hist')||'[]'),
  marks:JSON.parse(localStorage.getItem('ires_marks')||'{}'),
  planDone:JSON.parse(localStorage.getItem('ires_plan_done')||'{}'),
  deletedHistoryIds:JSON.parse(localStorage.getItem('ires_del_hist')||'[]'),
  deletedSimIds:JSON.parse(localStorage.getItem('ires_del_sims')||'[]'),
  deletedMarkIds:JSON.parse(localStorage.getItem('ires_del_marks')||'[]'),
  ghToken:localStorage.getItem('ires_gh_token')||'',
  pendingSync:localStorage.getItem('ires_pending')==='1',
  offlineReady:IS_APK || localStorage.getItem('ires_offline_ready')==='1',
  downloadingOffline:false,
  statsComputing:false,
  syncing:false,
  showSummary:false,
  reviewFilter:'all',
  activeQuiz:null, timer:null, catCache:{}, examsCache:null
};
function saveLocal(markPending){
  localStorage.setItem('ires_saved',JSON.stringify(state.savedQuizzes));
  localStorage.setItem('ires_hist',JSON.stringify(state.history));
  localStorage.setItem('ires_marks',JSON.stringify(state.marks));
  localStorage.setItem('ires_plan_done',JSON.stringify(state.planDone));
  localStorage.setItem('ires_del_hist',JSON.stringify(state.deletedHistoryIds));
  localStorage.setItem('ires_del_sims',JSON.stringify(state.deletedSimIds));
  localStorage.setItem('ires_del_marks',JSON.stringify(state.deletedMarkIds));
  localStorage.setItem('ires_meta',JSON.stringify(state.meta));
  localStorage.setItem('ires_gemini',JSON.stringify(state.gemini));
  if(markPending){ state.pendingSync=true; localStorage.setItem('ires_pending','1'); }
}
function removeMark(id){
  const qid=String(id);
  delete state.marks[qid];
  if(!state.deletedMarkIds.includes(qid)) state.deletedMarkIds.push(qid);
  saveLocal(true);
  pushUserSyncToGitHub(true);
  toast('Marca eliminada ✓');
  render();
}
function clearAllDoubts(){
  const entries=Object.entries(state.marks);
  const doubtIds=entries.filter(([,v])=>v && v.doubt).map(([k])=>k);
  if(!doubtIds.length){ toast('No hay dudosas para borrar.'); return; }
  if(!confirm('¿Borrar las '+doubtIds.length+' preguntas marcadas como dudosas?\n(Tus favoritas ★ y notas manuales se conservan.)')) return;
  doubtIds.forEach(qid=>{
    const m=state.marks[qid];
    if(!m) return;
    m.doubt=false;
    if(m.note && /^Fallada en /i.test(m.note.trim())) m.note='';
    if(!m.fav && !m.doubt && !m.note){
      delete state.marks[qid];
      if(!state.deletedMarkIds.includes(String(qid))) state.deletedMarkIds.push(String(qid));
    }
  });
  saveLocal(true);
  pushUserSyncToGitHub(true);
  toast('Dudosas borradas ✓');
  render();
}
function upsertSavedQuiz(qz){
  if(!qz || qz.status!=='ongoing') return;
  qz.updatedAt = new Date().toLocaleString('es');
  const idx = state.savedQuizzes.findIndex(x=>x.id===qz.id);
  if(idx>=0) state.savedQuizzes[idx]=qz;
  else state.savedQuizzes.unshift(qz);
  saveLocal(true);
}
function removeSavedQuiz(id, syncNow){
  state.savedQuizzes = state.savedQuizzes.filter(x=>String(x.id)!==String(id));
  saveLocal(true);
  if(syncNow) pushUserSyncToGitHub(true);
}
function getVisibleGeminiSims(){
  const del = new Set((state.deletedSimIds||[]).map(String));
  return (state.gemini.simulacrosGemini||[]).filter(s=>!del.has(String(s.id)));
}
function deleteGeminiSimulacro(simId, title){
  if(!confirm('¿Eliminar el simulacro "'+(title||simId)+'"?\n(Podés restaurarlo luego desde Ajustes si cambiás de idea.)')) return;
  const sid = String(simId);
  if(!state.deletedSimIds.includes(sid)) state.deletedSimIds.push(sid);
  state.savedQuizzes = state.savedQuizzes.filter(x=>String(x.id)!==sid);
  saveLocal(true);
  pushUserSyncToGitHub(true);
  toast('Simulacro eliminado ✓');
  render();
}
function restoreDeletedSims(){
  state.deletedSimIds = [];
  saveLocal(true);
  pushUserSyncToGitHub(true);
  toast('Simulacros de Gemini restaurados ✓');
  render();
}
function deleteHistoryItem(histId, title){
  if(!confirm('¿Eliminar "'+(title||'este simulacro')+'" del historial y de tus estadísticas?')) return;
  const hid = String(histId);
  state.history = state.history.filter(x=>String(x.id)!==hid);
  if(!state.deletedHistoryIds.includes(hid)) state.deletedHistoryIds.push(hid);
  saveLocal(true);
  pushUserSyncToGitHub(true);
  toast('Resultado eliminado ✓');
  render();
}
function applyZoom(){
  document.documentElement.style.setProperty('--ui-scale',state.zoom.toFixed(2));
  document.getElementById('zoomVal').textContent=Math.round(state.zoom*100)+'%';
  localStorage.setItem('ires_zoom',state.zoom.toFixed(2));
}
function changeZoom(d){state.zoom=Math.min(1.3,Math.max(0.75,state.zoom+d));applyZoom();}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',3200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function updateStatusBar(){
  const st=document.getElementById('syncStatus');
  const ob=document.getElementById('offlineBadge');
  if(navigator.onLine){
    if(state.syncing){
      st.innerHTML='<span class="badge-ok">● Online</span> · Sincronizando…';
    }else if(state.pendingSync){
      st.innerHTML='<span class="badge-ok">● Online</span> · '+(state.ghToken?'Pendiente de subir':'Guardado local (falta token en ⚙)');
    }else{
      st.innerHTML='<span class="badge-ok">● Online</span> · Sincronizado';
    }
  }else{
    st.innerHTML='<span class="badge-off">● Sin internet</span> · Guardado en dispositivo';
  }
  ob.textContent=IS_APK?'✓ APK Offline listo':(state.offlineReady?'✓ Offline listo':'Solo online');
}

async function downloadOfflinePack(silent){
  if(IS_APK){
    state.offlineReady=true; localStorage.setItem('ires_offline_ready','1');
    updateStatusBar();
    if(!silent) toast('Esta APK ya trae las 18.074 preguntas y 5 exámenes offline ✓');
    render(); return;
  }
  if(!('caches' in window)){ if(!silent) toast('Este navegador no soporta caché offline.'); return; }
  if(!navigator.onLine){ if(!silent) toast('Necesitás internet la primera vez para descargar el banco.'); return; }
  state.downloadingOffline=true; render();
  const files=['./','./index.html','./data/meta.json','./data/gemini_sync.json','./data/exams.json','./data/cat_1.json','./data/cat_2.json','./data/cat_3.json','./data/cat_4.json','./data/cat_5.json','./data/cat_6.json'];
  try{
    const cache=await caches.open(CACHE_NAME);
    let ok=0;
    for(const f of files){
      try{ const r=await fetch(f); if(r.ok){ await cache.put(f,r.clone()); ok++; } }catch(_){}
    }
    if(ok>=6){
      state.offlineReady=true; localStorage.setItem('ires_offline_ready','1');
      if(!silent) toast('¡Banco completo guardado para usar sin internet! ✓');
    }else if(!silent){ toast('Descarga parcial ('+ok+'/'+files.length+').'); }
  }catch(e){ if(!silent) toast('Error al guardar offline.'); }
  state.downloadingOffline=false; updateStatusBar(); render();
}

async function fetchRemoteUserSync(q){
  if(state.ghToken){
    try{
      const api=`https://api.github.com/repos/${REPO}/contents/docs/data/user_sync.json`;
      const r=await fetch(api,{headers:{Authorization:'Bearer '+state.ghToken,Accept:'application/vnd.github.raw+json'}});
      if(r.ok) return await r.json();
    }catch(_){}
  }
  const uRes = await fetch('data/user_sync.json'+q).catch(()=>null);
  if(uRes && uRes.ok) return await uRes.json();
  return null;
}

async function syncAll(showMsg){
  updateStatusBar();
  if(!navigator.onLine){ if(showMsg) toast('Sin internet: usando datos guardados en tu dispositivo.'); render(); return; }
  if(state.syncing) return;
  state.syncing=true; updateStatusBar();
  const q='?t='+Date.now();
  try{
    const [mRes,gRes]=await Promise.all([fetch('data/meta.json'+q).catch(()=>null),fetch('data/gemini_sync.json'+q).catch(()=>null)]);
    if(mRes && mRes.ok) state.meta = await mRes.json();
    if(gRes && gRes.ok) state.gemini = await gRes.json();
    const remote = await fetchRemoteUserSync(q);
    if(remote){
      if(Array.isArray(remote.deletedHistoryIds)){
        state.deletedHistoryIds = Array.from(new Set([...(state.deletedHistoryIds||[]).map(String), ...remote.deletedHistoryIds.map(String)]));
      }
      if(Array.isArray(remote.deletedSimIds)){
        state.deletedSimIds = Array.from(new Set([...(state.deletedSimIds||[]).map(String), ...remote.deletedSimIds.map(String)]));
      }
      if(Array.isArray(remote.deletedMarkIds)){
        state.deletedMarkIds = Array.from(new Set([...(state.deletedMarkIds||[]).map(String), ...remote.deletedMarkIds.map(String)]));
      }
      const delHistSet = new Set(state.deletedHistoryIds.map(String));
      if(Array.isArray(remote.history)){
        const byId=new Map(state.history.filter(x=>!delHistSet.has(String(x.id))).map(x=>[String(x.id),x]));
        remote.history.forEach(r=>{
          const rid=String(r.id);
          if(delHistSet.has(rid)) return;
          const cur=byId.get(rid);
          if(!cur || (r.answers && !cur.answers)) byId.set(rid, r);
          else if(cur && !cur.byCategory && r.byCategory) cur.byCategory = r.byCategory;
        });
        state.history=Array.from(byId.values()).sort((a,b)=>(b.id||0)-(a.id||0));
      }
      if(remote.marks){
        const delMarkSet = new Set((state.deletedMarkIds||[]).map(String));
        const mergedMarks = {};
        Object.entries(remote.marks).forEach(([k,v])=>{ if(!delMarkSet.has(String(k))) mergedMarks[k]=v; });
        Object.entries(state.marks).forEach(([k,v])=>{ if(!delMarkSet.has(String(k))) mergedMarks[k]=v; });
        state.marks = mergedMarks;
      }
      if(remote.planDone) state.planDone = Object.assign({}, remote.planDone, state.planDone);
    }
    saveLocal(false);
    if(state.pendingSync && state.ghToken) await pushUserSyncToGitHub(true);
    if(!state.offlineReady && !IS_APK) downloadOfflinePack(true);
    if(showMsg) toast(state.pendingSync && !state.ghToken ? 'Actualizado (agregá tu token en ⚙ para subir tu progreso)' : 'Sincronizado ✓');
  }catch(e){}
  state.syncing=false; updateStatusBar(); render();
}

async function pushUserSyncToGitHub(silent, retry){
  if(!navigator.onLine){ saveLocal(true); updateStatusBar(); if(!silent) toast('Guardado sin internet. Se sincronizará al volver la conexión ✓'); return false; }
  if(!state.ghToken){ updateStatusBar(); if(!silent) toast('Guardado en tu dispositivo ✓ (configurá token en ⚙ para sincronizar con GitHub)'); return false; }
  const api=`https://api.github.com/repos/${REPO}/contents/docs/data/user_sync.json`;
  try{
    let sha=null;
    const cur=await fetch(api,{headers:{Authorization:'Bearer '+state.ghToken}});
    if(cur.status===401||cur.status===403){
      if(!silent) toast('Token de GitHub inválido o sin permiso Contents: Write.');
      return false;
    }
    if(cur.ok){const j=await cur.json();sha=j.sha;}
    const payload={
      updatedAt:new Date().toISOString(),
      history:state.history.slice(0,150),
      marks:state.marks,
      planDone:state.planDone,
      deletedHistoryIds:state.deletedHistoryIds.slice(-300),
      deletedSimIds:state.deletedSimIds.slice(-100),
      deletedMarkIds:state.deletedMarkIds.slice(-500),
      savedCount:state.savedQuizzes.length
    };
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2))));
    const res=await fetch(api,{method:'PUT',headers:{Authorization:'Bearer '+state.ghToken,'Content-Type':'application/json'},body:JSON.stringify({message:'Sync progreso usuario',content,sha:sha||undefined})});
    if(res.status===409 && !retry) return await pushUserSyncToGitHub(silent, true);
    if(res.ok){
      state.pendingSync=false; localStorage.setItem('ires_pending','0');
      updateStatusBar();
      if(!silent) toast('Sincronizado con GitHub ✓');
      return true;
    }
    saveLocal(true); updateStatusBar();
    if(!silent) toast('Error al subir a GitHub ('+res.status+'). Quedó guardado local.');
    return false;
  }catch(e){ saveLocal(true); updateStatusBar(); return false; }
}

function saveAndExitQuiz(){
  if(state.activeQuiz && state.activeQuiz.status==='ongoing'){
    upsertSavedQuiz(state.activeQuiz);
    clearInterval(state.timer);
    state.activeQuiz=null;
    toast('Simulacro guardado. Podés continuarlo cuando quieras ✓');
  }
  setTab('history');
}

function setTab(t){
  if(state.activeQuiz && t!=='runner'){
    if(state.activeQuiz.status==='ongoing'){
      upsertSavedQuiz(state.activeQuiz);
      toast('Progreso guardado automáticamente ✓');
    }
    clearInterval(state.timer); state.activeQuiz=null;
  }
  state.tab=t;
  document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  const names={quiz:'→ Quiz',exams:'→ Simulador',gemini:'→ Gemini',history:'→ Historial',stats:'→ Stats',settings:'→ Ajustes',runner:'→ En curso'};
  document.getElementById('sectionName').textContent=names[t]||'';
  render();
}

function render(){
  const root=document.getElementById('app');
  if(state.activeQuiz){renderRunner(root);return;}
  if(state.tab==='quiz') renderQuizHome(root);
  else if(state.tab==='exams') renderExams(root);
  else if(state.tab==='gemini') renderGemini(root);
  else if(state.tab==='history') renderHistory(root);
  else if(state.tab==='stats') renderStats(root);
  else if(state.tab==='settings') renderSettings(root);
}

async function loadCat(cid){
  if(state.catCache[cid]) return state.catCache[cid];
  const r=await fetch(`data/cat_${cid}.json`);
  if(!r.ok) throw new Error('Sin conexión y categoría aún no descargada. Tocá "Descargar ahora" con internet.');
  const d=await r.json(); state.catCache[cid]=d; return d;
}

async function quickCat(cid,name){
  document.getElementById('app').innerHTML='<div class="card muted">Cargando preguntas de '+esc(name)+'…</div>';
  try{
    const pool=await loadCat(cid);
    const extras=(state.gemini.preguntasExtra||[]).filter(q=>q.category===cid);
    const picked=shuffle(extras.concat(pool)).slice(0,15).map(q=>({...q,categoryName:q.categoryName||name}));
    beginQuiz(name,'immediate',picked);
  }catch(e){ toast(e.message); render(); }
}

async function launchCustom(saveOnly){
  const counts={}; let total=0;
  (state.meta.categories||DEFAULT_CATS).forEach(c=>{const v=Number(document.getElementById('cnt_'+c.id).value)||0;if(v>0){counts[c.id]=v;total+=v;}});
  if(total<1||total>180){toast('Elegí entre 1 y 180 preguntas.');return;}
  const mode=document.getElementById('qMode').value;
  document.getElementById('app').innerHTML='<div class="card muted">Armando simulacro…</div>';
  try{
    let res=[];
    for(const cidStr of Object.keys(counts)){
      const cid=Number(cidStr), catName=(state.meta.categories.find(x=>x.id===cid)||{}).name||'';
      const pool=await loadCat(cid);
      res=res.concat(shuffle(pool).slice(0,counts[cidStr]).map(q=>({...q,categoryName:catName})));
    }
    const qs=shuffle(res);
    if(saveOnly){
      const qz={id:'qz_'+Date.now(),title:'Simulacro ('+qs.length+')',mode,questions:qs,index:0,answers:{},checked:{},elapsed:0,status:'ongoing'};
      upsertSavedQuiz(qz);
      toast('Simulacro guardado en Historial para hacerlo después ✓');
      setTab('history');
    }else{
      beginQuiz('Simulacro ('+qs.length+')',mode,qs);
    }
  }catch(e){ toast(e.message); render(); }
}

async function startGeminiSimulacro(simId){
  const sim=(state.gemini.simulacrosGemini||[]).find(s=>s.id===simId);
  if(!sim){toast('Simulacro no encontrado.');return;}
  const existing=state.savedQuizzes.find(x=>x.id===sim.id);
  if(existing){ resumeSavedQuiz(existing.id); return; }
  document.getElementById('app').innerHTML='<div class="card muted">Cargando '+esc(sim.titulo)+'…</div>';
  try{
    let qs=[];
    if(Array.isArray(sim.questions) && sim.questions.length){
      qs=sim.questions;
    }else if(Array.isArray(sim.questionIds) && sim.questionIds.length){
      const byId={};
      for(const cid of (sim.categories||[1,2,3,4,5,6])){
        const catName=(state.meta.categories.find(x=>x.id===cid)||{}).name||sim.categoria||'';
        const pool=await loadCat(cid);
        pool.forEach(q=>{ byId[String(q.id)]={...q,categoryName:catName}; });
      }
      (state.gemini.preguntasExtra||[]).forEach(q=>{ byId[String(q.id)]=q; });
      qs=sim.questionIds.map(id=>byId[String(id)]).filter(Boolean);
    }
    if(!qs.length) throw new Error('Descargá el banco offline primero para abrir este simulacro.');
    beginQuiz(sim.titulo, sim.mode||'immediate', qs, sim.id);
  }catch(e){ toast(e.message); render(); }
}

function beginQuiz(title,mode,questions,customId){

function resumeSavedQuiz(id){
  const found=state.savedQuizzes.find(x=>x.id===id);
  if(!found){toast('No se encontró el simulacro guardado.');return;}
  state.activeQuiz=found;
  startQuizTimer();

function startQuizTimer(){
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    if(state.activeQuiz && state.activeQuiz.status==='ongoing'){
      state.activeQuiz.elapsed++;
      const el=document.getElementById('tVal'); if(el) el.textContent=fmtTime(state.activeQuiz.elapsed);
      if(state.activeQuiz.elapsed % 10 === 0) upsertSavedQuiz(state.activeQuiz);
    }
  },1000);
}

function getFilteredIndices(qz){
  if(qz.status!=='completed' || state.reviewFilter==='all'){
    return qz.questions.map((_,i)=>i);
  }
  return qz.questions.map((it,i)=>{
    const a=qz.answers[it.id];
    const ok=a!=null && !!it.options.find(o=>o.id===a)?.correct;
    if(state.reviewFilter==='wrong') return !ok ? i : -1;
    if(state.reviewFilter==='correct') return ok ? i : -1;
    return i;
  }).filter(i=>i>=0);
}
function setReviewFilter(f){
  state.reviewFilter=f;
  const qz=state.activeQuiz;
  if(qz){
    const idxs=getFilteredIndices(qz);
    if(idxs.length && !idxs.includes(qz.index)) qz.index=idxs[0];
  }
  render();
}
function stepQ(delta){
  const qz=state.activeQuiz; if(!qz) return;
  const idxs=getFilteredIndices(qz);
  if(!idxs.length) return;
  const pos=idxs.indexOf(qz.index);
  const nextPos=pos<0 ? 0 : pos+delta;
  if(nextPos>=0 && nextPos<idxs.length) jumpQ(idxs[nextPos]);
}
function bindSwipeNav(el){
  if(!el || el._swipeBound) return;
  el._swipeBound=true;
  let sx=0, sy=0;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!sx && !sy) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    sx=0; sy=0;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.5){
      stepQ(dx<0?1:-1);
    }
  },{passive:true});
}

function renderRunner(root){
  const qz=state.activeQuiz;
  const visibleIdxs=getFilteredIndices(qz);
  if(visibleIdxs.length && !visibleIdxs.includes(qz.index)) qz.index=visibleIdxs[0];
  const q=qz.questions[qz.index], chosen=qz.answers[q.id];
  const rev=qz.status==='completed'||(qz.mode==='immediate'&&qz.checked[q.id]);
  const mk=state.marks[String(q.id)]||{fav:false,doubt:false,note:''};
  const posInFilter=visibleIdxs.indexOf(qz.index);
  const hasPrev=posInFilter>0;
  const hasNext=posInFilter>=0 && posInFilter<visibleIdxs.length-1;

  const nav=visibleIdxs.map(i=>{
    const it=qz.questions[i];
    let c=i===qz.index?'selected':'';const a=qz.answers[it.id];
    if(a!=null){const r2=qz.status==='completed'||(qz.mode==='immediate'&&qz.checked[it.id]);c+=r2?(it.options.find(o=>o.id===a)?.correct?' good':' bad'):' answered';}
    return `<button class="${c}" onclick="jumpQ(${i})">${i+1}</button>`;
  }).join('');

  const letters=['A','B','C','D','E','F'];
  const ans=q.options.map((o,i)=>{
    let c='answer';if(chosen===o.id)c+=' chosen';
    if(rev){if(o.correct)c+=' correct';else if(chosen===o.id)c+=' wrong';}
    return `<button class="${c}" ${rev?'disabled':''} onclick="pickAns('${esc(q.id)}',${o.id})"><span class="letter">${letters[i]||i+1}</span><span>${esc(o.text)}</span></button>`;
  }).join('');

  let sum='', filterHtml='';
  if(qz.status==='completed'){
    const sc=scoreQz(qz);
    let detailsHtml='';
    if(state.showSummary){
      const byCat=computeCategoryBreakdown(qz.questions, qz.answers);
      const catKeys=Object.keys(byCat).map(Number).sort((a,b)=>a-b);
      const catHtml=catKeys.length>1 ? '<div style="margin-top:.65rem">'+catKeys.map(cid=>{
        const st=byCat[cid], pct=st.total?Math.round(st.ok/st.total*100):0;
        const cls=pct>=70?'pct-hi':(pct>=50?'pct-mid':'pct-lo');
        const bCls=pct>=70?'':(pct>=50?'mid':'low');
        return `<div class="cat-stat"><div class="row"><span>${CAT_ICONS[cid]||'📘'} <strong>${esc(getCatName(cid))}</strong></span><strong class="${cls}">${pct}%</strong></div><div class="bar"><span class="${bCls}" style="width:${pct}%"></span></div><div class="muted" style="font-size:.76rem">${st.ok}/${st.total} correctas · ${st.bad} inc.${st.un?' · '+st.un+' sin resp.':''}</div></div>`;
      }).join('')+'</div>' : '';
      detailsHtml=`<div style="margin-top:.55rem;padding-top:.55rem;border-top:1px solid #333"><div class="muted" style="font-size:.82rem">${sc.ok} correctas · ${sc.bad} incorrectas · ${sc.un} sin responder · ${fmtTime(qz.elapsed)}</div>${catHtml}</div>`;
    }
    const pctCls=sc.pct>=70?'pct-hi':(sc.pct>=50?'pct-mid':'pct-lo');
    sum=`<div class="summary-bar"><div class="row"><div><strong class="${pctCls}" style="font-size:1.15rem">${sc.pct}%</strong> <span class="muted" style="font-size:.8rem">(${sc.ok}✓ · ${sc.bad+sc.un}✗)</span></div><div class="row" style="gap:.35rem"><button class="ghost btn-sm" onclick="state.showSummary=!state.showSummary;render()">${state.showSummary?'Ocultar ▴':'Resumen ▾'}</button><button class="primary btn-sm" onclick="state.activeQuiz=null;setTab('history')">Salir</button></div></div>${detailsHtml}</div>`;
    const wrongCnt=sc.bad+sc.un;
    filterHtml=`<div class="filter-pills">
      <button class="${state.reviewFilter==='all'?'active':''}" onclick="setReviewFilter('all')">Todas (${qz.questions.length})</button>
      <button class="${state.reviewFilter==='wrong'?'active':''}" onclick="setReviewFilter('wrong')">✗ Falladas (${wrongCnt})</button>
      <button class="${state.reviewFilter==='correct'?'active':''}" onclick="setReviewFilter('correct')">✓ Acertadas (${sc.ok})</button>
    </div>`;
  }

  root.innerHTML=`${sum}<div class="row" style="margin-bottom:.35rem">
    <div><strong>${esc(qz.title)}</strong><div class="muted" style="font-size:.78rem">Pregunta ${qz.index+1}/${qz.questions.length} · <span id="tVal" style="color:var(--teal)">${fmtTime(qz.elapsed)}</span></div></div>
    ${qz.status==='ongoing'?`<button class="ghost btn-sm" onclick="saveAndExitQuiz()">⏸ Guardar</button>`:''}
  </div>
  ${filterHtml}
  <div class="qnav">${nav}</div>
  <div id="swipeArea">
    <div class="question-box">${esc(q.text)}<div><span class="tag">${esc(q.categoryName||'Residencia')}</span><span class="tag">${esc(q.id)}</span>${q.origin?`<span class="tag">✦ ${esc(q.origin)}</span>`:''}</div></div>
    <div class="answers">${ans}</div>
    ${rev&&q.explanation?`<div class="explain"><strong>Explicación:</strong> ${esc(q.explanation)}</div>`:''}
  </div>
  <div class="runner-nav">
    <button onclick="stepQ(-1)" ${!hasPrev?'disabled':''}>← Anterior</button>
    ${hasNext?`<button class="primary" onclick="stepQ(1)">Siguiente →</button>`:(qz.status==='ongoing'?`<button class="teal" onclick="finishQz()">Finalizar ✓</button>`:`<button class="ghost" onclick="state.activeQuiz=null;setTab('history')">Finalizar revisión</button>`)}
  </div>
  <div class="row" style="gap:.4rem">
    <button class="${mk.fav?'teal':'ghost'} btn-sm" onclick="toggleMk('${esc(q.id)}','fav')">${mk.fav?'★ Favorito':'☆ Favorito'}</button>
    <button class="${mk.doubt?'danger':'ghost'} btn-sm" onclick="toggleMk('${esc(q.id)}','doubt')">${mk.doubt?'? Dudosa ✓':'? Dudosa'}</button>
    <button class="ghost btn-sm" onclick="editNote('${esc(q.id)}')">✎ ${mk.note?'Ver nota':'Nota'}</button>
  </div>`;

  // Mantener centrada la burbuja activa para que no salte al #1
  const qnav=root.querySelector('.qnav');
  const selBtn=qnav && qnav.querySelector('button.selected');
  if(qnav && selBtn){
    qnav.scrollLeft=Math.max(0, selBtn.offsetLeft - qnav.clientWidth/2 + selBtn.offsetWidth/2);
  }
  bindSwipeNav(document.getElementById('swipeArea'));
}
function getCatName(cid){
  const id=Number(cid);
  if(id===0) return 'Exámenes de Residencia';
  return ((state.meta.categories||DEFAULT_CATS).find(x=>Number(x.id)===id)||{}).name||('Materia '+id);
}
async function loadExams(){
  if(state.examsCache) return state.examsCache;
  const r=await fetch('data/exams.json');
  if(!r.ok) throw new Error('Sin conexión y exámenes aún no descargados.');
  const d=await r.json(); state.examsCache=d; return d;
}
function computeCategoryBreakdown(questions, answers){
  const byCat={};
  (questions||[]).forEach(q=>{
    const cid=Number(q.category!=null?q.category:0);
    if(!byCat[cid]) byCat[cid]={ok:0,bad:0,un:0,total:0};
    byCat[cid].total++;
    const a=answers?answers[q.id]:null;
    if(a==null) byCat[cid].un++;
    else if(q.options && q.options.find(o=>o.id===a)?.correct) byCat[cid].ok++;
    else byCat[cid].bad++;
  });
  return byCat;
}
function jumpQ(i){if(!state.activeQuiz||i<0||i>=state.activeQuiz.questions.length)return;state.activeQuiz.index=i;if(state.activeQuiz.status==='ongoing')upsertSavedQuiz(state.activeQuiz);render();}
function pickAns(qid,oid){const qz=state.activeQuiz;qz.answers[qid]=oid;if(qz.mode==='immediate')qz.checked[qid]=true;upsertSavedQuiz(qz);render();}
function scoreQz(qz){let ok=0,bad=0,un=0;qz.questions.forEach(q=>{const a=qz.answers[q.id];if(a==null)un++;else if(q.options.find(o=>o.id===a)?.correct)ok++;else bad++;});return{ok,bad,un,total:qz.questions.length,pct:qz.questions.length?Math.round(ok/qz.questions.length*100):0};}
function finishQz(){
  const qz=state.activeQuiz; clearInterval(state.timer); qz.status='completed';
  state.showSummary=true; state.reviewFilter='all';
  const sc=scoreQz(qz);
  const byCat=computeCategoryBreakdown(qz.questions, qz.answers);
  removeSavedQuiz(qz.id, false);
  const cats=Array.from(new Set(qz.questions.map(q=>q.category).filter(c=>c!=null && c!==0)));
  state.history.unshift({id:Date.now(),simId:qz.id,fecha:new Date().toLocaleString('es'),titulo:qz.title,pct:sc.pct,ok:sc.ok,bad:sc.bad,un:sc.un,elapsed:qz.elapsed,categories:cats.length?cats:[1,2,3,4,5,6],byCategory:byCat,questionIds:qz.questions.map(q=>q.id),answers:{...qz.answers}});
  saveLocal(true); pushUserSyncToGitHub(false); render();
}
async function openHistoryReview(histId){
  const item=state.history.find(x=>String(x.id)===String(histId));
  if(!item || !Array.isArray(item.questionIds) || !item.questionIds.length){toast('Este quiz no tiene respuestas guardadas para revisar.');return;}
  document.getElementById('app').innerHTML='<div class="card muted">Cargando revisión de '+esc(item.titulo)+'…</div>';
  try{
    const byId={};
    const needsExams=item.questionIds.some(id=>String(id).startsWith('e'));
    if(needsExams){
      const exPool=await loadExams();
      exPool.forEach(q=>{ byId[String(q.id)]={...q,categoryName:q.categoryName||'Examen de Residencia'}; });
    }
    for(const cid of (item.categories||[1,2,3,4,5,6])){
      if(Number(cid)===0) continue;
      const catName=getCatName(cid);
      const pool=await loadCat(cid);
      pool.forEach(q=>{ byId[String(q.id)]={...q,categoryName:catName}; });
    }
    (state.gemini.preguntasExtra||[]).forEach(q=>{ byId[String(q.id)]=q; });
    const qs=item.questionIds.map(id=>byId[String(id)]).filter(Boolean);
    if(!qs.length) throw new Error('Descargá el banco offline primero para revisar este simulacro.');
    clearInterval(state.timer);
    state.showSummary=false; state.reviewFilter='all';
    state.activeQuiz={id:'rev_'+item.id,title:item.titulo,mode:'final',questions:qs,index:0,answers:item.answers||{},checked:{},elapsed:item.elapsed||0,status:'completed'};
    document.getElementById('sectionName').textContent='→ Revisión';
    render();
  }catch(e){ toast(e.message); render(); }
}
function toggleMk(id,f){
  const qid=String(id);
  const m=state.marks[qid]||{fav:false,doubt:false,note:''};
  m[f]=!m[f];
  if(!m.fav && !m.doubt && !m.note){
    delete state.marks[qid];
    if(!state.deletedMarkIds.includes(qid)) state.deletedMarkIds.push(qid);
  }else{
    state.marks[qid]=m;
    state.deletedMarkIds=state.deletedMarkIds.filter(x=>x!==qid);
  }
  saveLocal(true); pushUserSyncToGitHub(true); render();
}
function editNote(id){
  const qid=String(id);
  const m=state.marks[qid]||{fav:false,doubt:false,note:''};
  const t=prompt('Nota personal:',m.note||'');
  if(t===null) return;
  m.note=t.trim();
  if(!m.fav && !m.doubt && !m.note){
    delete state.marks[qid];
    if(!state.deletedMarkIds.includes(qid)) state.deletedMarkIds.push(qid);
  }else{
    state.marks[qid]=m;
    state.deletedMarkIds=state.deletedMarkIds.filter(x=>x!==qid);
  }
  saveLocal(true); pushUserSyncToGitHub(true); render();
}

function renderGemini(root){
  const sims=getVisibleGeminiSims(), plans=state.gemini.planGemini||[], ex=state.gemini.preguntasExtra||[];
  let h=`<div class="row" style="margin-bottom:.8rem"><h2 style="margin:0">✦ Simulacros y Plan de Gemini</h2>${ex.length?`<button class="teal" onclick="startExtras()">Preguntas extra (${ex.length})</button>`:''}</div>`;
  if(sims.length){
    h+='<h3 style="margin-bottom:.5rem">Simulacros guardados para vos</h3>';
    sims.forEach(s=>{
      const inProg=state.savedQuizzes.find(x=>x.id===s.id);
      const doneItem=state.history.find(x=>x.simId===s.id && x.answers);
      const cnt=(s.questionIds||s.questions||[]).length;
      const safeTitle=esc(s.titulo).replace(/'/g,"&#39;");
      h+=`<div class="card row" style="border:1px solid ${doneItem?'var(--teal)':'#4d3f6b'}"><div><strong>${esc(s.titulo)}</strong><div class="muted" style="font-size:.8rem">${esc(s.categoria||'General')} · ${cnt} preguntas · ${esc(s.fecha||'')}${doneItem?` · <span style="color:var(--teal);font-weight:700">✓ Respondido (${doneItem.pct}%)</span>`:''}</div></div><div class="row">${doneItem?`<button class="teal btn-sm" onclick="openHistoryReview('${doneItem.id}')">Ver revisión →</button>`:''}<button class="${doneItem?'ghost':'primary'} btn-sm" onclick="startGeminiSimulacro('${esc(s.id)}')">${inProg?'Continuar →':(doneItem?'Repetir':'Resolver →')}</button><button class="danger btn-sm" title="Eliminar simulacro" onclick="deleteGeminiSimulacro('${esc(s.id)}','${safeTitle}')">✕</button></div></div>`;
    });
  }else{
    h+='<div class="card muted">No hay simulacros activos de Gemini.'+(state.deletedSimIds.length?' (Podés restaurar eliminados en Ajustes ⚙)':'')+'</div>';
  }
  h+='<h3 style="margin:1rem 0 .5rem">Tareas y microlecciones</h3>';
  plans.forEach(p=>{
    const done=!!state.planDone[p.id];
    h+=`<div class="card"><div class="row"><strong>${esc(p.titulo)}</strong><span style="color:${done?'var(--teal)':'var(--amber)'};font-size:.8rem;font-weight:700">${done?'Completado':'Pendiente'}</span></div><div class="muted" style="font-size:.78rem;margin:.25rem 0 .5rem">${esc(p.tipo)} · ${esc(p.categoria)} · ${esc(p.fecha)}</div><p style="line-height:1.45">${esc(p.contenido)}</p><button class="${done?'ghost':'teal'}" onclick="state.planDone['${esc(p.id)}']=!state.planDone['${esc(p.id)}'];saveLocal(true);pushUserSyncToGitHub(true);render()">${done?'Marcar pendiente':'Marcar completado ✓'}</button></div>`;
  });
  root.innerHTML=h;
}

function renderHistory(root){
  let h='<h2>Simulacros guardados (en curso)</h2>';
  if(!state.savedQuizzes.length){
    h+='<div class="card muted">No tenés simulacros pausados. Cualquier simulacro que empieces o guardes aparece acá.</div>';
  }else{
    state.savedQuizzes.forEach(q=>{
      const ansCnt=Object.keys(q.answers||{}).length;
      const pct=q.questions.length?Math.round(ansCnt/q.questions.length*100):0;
      h+=`<div class="card" style="border:1px solid #594b34"><div class="row"><div><h3 style="margin-bottom:.15rem">⏸ ${esc(q.title)}</h3><div class="muted" style="font-size:.8rem">${ansCnt}/${q.questions.length} respondidas · ${fmtTime(q.elapsed||0)} · ${esc(q.updatedAt||'')}</div></div><div class="row"><button class="primary btn-sm" onclick="resumeSavedQuiz('${esc(q.id)}')">Continuar →</button><button class="danger btn-sm" title="Eliminar" onclick="if(confirm('¿Eliminar este simulacro guardado?')){removeSavedQuiz('${esc(q.id)}',true);render();}">✕</button></div></div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
    });
  }
  h+='<h2 style="margin-top:1.2rem">Completados</h2>';
  if(!state.history.length){
    h+='<div class="card muted">Todavía no completaste ningún quiz.</div>';
  }else{
    state.history.forEach(x=>{
      const canRev=Array.isArray(x.questionIds)&&x.questionIds.length&&x.answers;
      const safeTitle=esc(x.titulo).replace(/'/g,"&#39;");
      h+=`<div class="card"><div class="row"><div><h3 style="margin-bottom:.15rem">${esc(x.titulo)}</h3><div class="muted" style="font-size:.8rem">${esc(x.fecha)}</div></div><strong style="font-size:1.4rem;color:var(--teal)">${x.pct}%</strong></div><div class="bar"><span style="width:${x.pct}%"></span></div><div class="row"><div class="muted" style="font-size:.8rem">${x.ok} correctas · ${x.bad} incorrectas · ${fmtTime(x.elapsed||0)}</div><div class="row" style="gap:.4rem">${canRev?`<button class="teal btn-sm" onclick="openHistoryReview('${x.id}')">Revisar →</button>`:''}<button class="danger btn-sm" title="Eliminar del historial" onclick="deleteHistoryItem('${x.id}','${safeTitle}')">✕</button></div></div></div>`;
    });
  }
  root.innerHTML=h;
}

async function ensureHistoryCategoryStats(){
  const missing=state.history.filter(x=>!x.byCategory && Array.isArray(x.questionIds) && x.questionIds.length && x.answers);
  if(!missing.length || state.statsComputing) return;
  state.statsComputing=true;
  try{
    const byId={};
    const neededCats=new Set();
    let needsExams=false;
    missing.forEach(item=>{
      if(item.questionIds.some(id=>String(id).startsWith('e'))) needsExams=true;
      (item.categories||[1,2,3,4,5,6]).forEach(c=>{ if(Number(c)>0) neededCats.add(Number(c)); });
    });
    if(needsExams){
      try{
        const exPool=await loadExams();
        exPool.forEach(q=>{ byId[String(q.id)]=q; });
      }catch(_){}
    }
    for(const cid of neededCats){
      try{
        const pool=await loadCat(cid);
        pool.forEach(q=>{ byId[String(q.id)]=q; });
      }catch(_){}
    }
    (state.gemini.preguntasExtra||[]).forEach(q=>{ byId[String(q.id)]=q; });
    let updated=false;
    missing.forEach(item=>{
      const qs=item.questionIds.map(id=>byId[String(id)]).filter(Boolean);
      if(qs.length){
        item.byCategory=computeCategoryBreakdown(qs, item.answers);
        updated=true;
      }
    });
    if(updated) saveLocal(false);
  }finally{
    state.statsComputing=false;
    if(state.tab==='stats' && !state.activeQuiz) renderStats(document.getElementById('app'));
  }
}

function renderStats(root){
  const n=state.history.length;
  const totOk=state.history.reduce((a,b)=>a+(b.ok||0),0);
  const totQ=state.history.reduce((a,b)=>a+(b.ok||0)+(b.bad||0)+(b.un||0),0);
  const avg=totQ?Math.round(totOk/totQ*100):(n?Math.round(state.history.reduce((a,b)=>a+b.pct,0)/n):0);
  const mks=Object.entries(state.marks).filter(([,v])=>v && (v.fav || v.doubt || v.note));
  const favs=mks.filter(([,v])=>v.fav).length, doubts=mks.filter(([,v])=>v.doubt).length;

  const needCompute=state.history.some(x=>!x.byCategory && Array.isArray(x.questionIds) && x.questionIds.length && x.answers);
  if(needCompute && !state.statsComputing) ensureHistoryCategoryStats();

  const agg={};
  (state.meta.categories||DEFAULT_CATS).forEach(c=>{ agg[c.id]={id:c.id,name:c.name,ok:0,bad:0,un:0,total:0}; });
  state.history.forEach(item=>{
    if(item.byCategory){
      Object.entries(item.byCategory).forEach(([cidStr,st])=>{
        const cid=Number(cidStr);
        if(!agg[cid]) agg[cid]={id:cid,name:getCatName(cid),ok:0,bad:0,un:0,total:0};
        agg[cid].ok+=(st.ok||0);
        agg[cid].bad+=(st.bad||0);
        agg[cid].un+=(st.un||0);
        agg[cid].total+=(st.total||0);
      });
    }else if(Array.isArray(item.categories) && item.categories.length===1){
      const cid=Number(item.categories[0]);
      if(!agg[cid]) agg[cid]={id:cid,name:getCatName(cid),ok:0,bad:0,un:0,total:0};
      agg[cid].ok+=(item.ok||0);
      agg[cid].bad+=(item.bad||0);
      agg[cid].un+=(item.un||0);
      agg[cid].total+=(item.ok||0)+(item.bad||0)+(item.un||0);
    }
  });

  const catList=[1,2,3,4,5,6].map(id=>agg[id]).filter(Boolean);
  if(agg[0] && agg[0].total>0) catList.push(agg[0]);

  const catRows=catList.map(c=>{
    const hasData=c.total>0;
    const pct=hasData?Math.round(c.ok/c.total*100):0;
    const pctCls=!hasData?'muted':(pct>=70?'pct-hi':(pct>=50?'pct-mid':'pct-lo'));
    const barCls=pct>=70?'':(pct>=50?'mid':'low');
    return `<div class="cat-stat">
      <div class="row"><div><span>${CAT_ICONS[c.id]||'📘'}</span> <strong>${esc(c.name)}</strong></div><strong class="${pctCls}" style="font-size:1.1rem">${hasData?pct+'%':'—'}</strong></div>
      <div class="bar"><span class="${barCls}" style="width:${hasData?pct:0}%"></span></div>
      <div class="muted" style="font-size:.78rem">${hasData?`${c.ok} correctas · ${c.bad} incorrectas${c.un?' · '+c.un+' sin resp.':''} (${c.total} preguntas)`:'Sin preguntas respondidas todavía'}</div>
    </div>`;
  }).join('');

  root.innerHTML=`<h2>Estadísticas</h2>
  <div class="stat-grid">
    <div class="metric"><span class="muted">Simulacros</span><strong>${n}</strong></div>
    <div class="metric"><span class="muted">Acierto global</span><strong>${avg}%</strong></div>
    <div class="metric"><span class="muted">Preguntas</span><strong>${totOk}/${totQ}</strong></div>
    <div class="metric"><span class="muted">Fav / Dudas</span><strong>${favs}/${doubts}</strong></div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:.65rem"><h3 style="margin:0">Porcentaje por materia</h3>${state.statsComputing?'<span class="muted" style="font-size:.78rem">Calculando…</span>':''}</div>
    ${catRows}
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:.65rem"><h3 style="margin:0">Preguntas marcadas (${mks.length})</h3>${doubts?`<button class="danger btn-sm" onclick="clearAllDoubts()">Limpiar dudosas (${doubts})</button>`:''}</div>
    ${mks.length?mks.map(([id,v])=>`<div class="config-row"><div><strong>${esc(id)}</strong> <span class="muted" style="font-size:.82rem">${v.fav?'★ ':''}${v.doubt?'? Dudosa':''}</span>${v.note?`<div class="muted" style="font-size:.8rem">✎ ${esc(v.note)}</div>`:''}</div><button class="danger btn-sm" title="Quitar marca" onclick="removeMark('${esc(id)}')">✕</button></div>`).join(''):'<p class="muted">Sin marcas todavía. Marcá ★ Favorito o ? Dudosa manualmente cuando quieras repasar una pregunta.</p>'}
  </div>`;
}

  root.innerHTML=`<h2>Ajustes y Modo Offline</h2>
  <div class="card"><h3>Modo sin internet (Offline)</h3>
  <p class="muted" style="font-size:.86rem">Estado actual: <strong>${IS_APK?'✓ APK con banco completo integrado (18.074 preguntas + 5 exámenes sin internet)':(state.offlineReady?'✓ Banco completo descargado en este dispositivo':'Pendiente de descarga')}</strong></p>
  ${!IS_APK?`<button class="teal" ${state.downloadingOffline?'disabled':''} onclick="downloadOfflinePack(false)">${state.downloadingOffline?'Descargando…':'Descargar / actualizar banco offline'}</button>`:''}</div>
  <div class="card"><h3>Sincronización automática APK ↔ GitHub</h3>

  <input id="tkIn" type="password" value="${esc(state.ghToken)}" placeholder="github_pat_..." style="width:100%;margin-bottom:.7rem">

}

function exportBackup(){
  const blob=new Blob([JSON.stringify({savedQuizzes:state.savedQuizzes,history:state.history,marks:state.marks,planDone:state.planDone,deletedHistoryIds:state.deletedHistoryIds,deletedSimIds:state.deletedSimIds},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iresidencia-backup.json';a.click();
}

window.onAndroidNetworkChange = function(isOnline){
  updateStatusBar();
  if(isOnline){
    syncAll(true);
  }else{
    toast('Sin internet: tu progreso se guarda localmente.');
  }
};

if('serviceWorker' in navigator && !IS_APK){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
window.addEventListener('online',()=>{ updateStatusBar(); syncAll(true); });
window.addEventListener('offline',()=>{ updateStatusBar(); toast('Modo sin internet activado: tu progreso se guarda localmente.'); });

applyZoom(); updateStatusBar(); syncAll(false);
